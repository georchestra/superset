# -----------------------------------------------------------------------
# We don't support docker compose for production environments.
# If you choose to use this type of deployment make sure to
# create you own docker environment file (envs/.envs-superset) with your own
# unique random secure passwords and SECRET_KEY.
# -----------------------------------------------------------------------
x-superset-image: &superset-image georchestra/superset:6.1.0-georchestra-01
x-superset-volumes:
  &superset-volumes
  - superset_home:/app/superset_home
  - ./config:/etc/georchestra
x-superset-env-files: &superset-env-files
  - ./envs/.envs-superset

services:
  superset-redis:
    image: redis:7
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"] 
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s
    container_name: superset-redis
    restart: unless-stopped
    volumes:
      - redis:/data

  superset:
    image: *superset-image
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:8088/superset/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 3
      start_period: 15s
    container_name: superset
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    user: "root"
    restart: unless-stopped
    # ports:
    #   - 8088:8088
    volumes: *superset-volumes
    env_file: *superset-env-files
    environment:
      GUNICORN_KEEPALIVE: "30"
      SERVER_THREADS_AMOUNT: "5"
      SERVER_WORKER_AMOUNT: "5"
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"

  superset-init:
    image: *superset-image
    container_name: superset-init
    command: ["/bin/bash", "-c", "cp /etc/georchestra/superset/docker-init.sh /app/docker/docker-init.sh && chmod +x /app/docker/docker-init.sh && /app/docker/docker-init.sh"]
    # command: ["/app/docker/docker-init.sh"]
    deploy:
      mode: global-job
    env_file: *superset-env-files
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true
    environment:
      SUPERSET_LOAD_EXAMPLES: "${SUPERSET_LOAD_EXAMPLES:-no}"
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"

  superset-worker:
    image: *superset-image
    container_name: superset-worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    env_file: *superset-env-files
    restart: unless-stopped
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      test: [ "CMD", "/bin/bash", "-c", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME" ]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  superset-worker-beat:
    image: *superset-image
    container_name: superset-worker-beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    env_file: *superset-env-files
    restart: unless-stopped
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true
    environment:
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"

volumes:
  superset_home:
    external: false
  redis:
    external: false
